name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java Development Kit (JDK)
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'

    - name: Generate Flutter App Structure
      run: |
        flutter create --org com.example --template=app temp_app
        shopt -s dotglob nullglob
        mv temp_app/* .
        rm -rf temp_app

    - name: Configure Android Min SDK
      run: |
        sed -i 's/minSdkVersion .*/minSdkVersion 24/g' android/app/build.gradle

    - name: Install Dependencies
      run: flutter pub get

    - name: Build APK Release
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FFmpeg-Super-Fast-APK
        path: build/app/outputs/flutter-apk/app-release.apk
